<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Console X 1TB Edition | Example Store</title>
  <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Product","name":"Console X 1TB Edition",
     "offers":{"@type":"Offer","price":"499.99","priceCurrency":"USD","availability":"https://schema.org/OutOfStock"}}
  </script>
</head>
<body>
  <header>
    <nav id="nav"></nav>
    <!-- A sign-in dropdown that is closed: its password field must NOT trigger the guard. -->
    <div id="signin-dropdown" style="display:none">
      <input type="email" name="email"><input type="password" name="password">
    </div>
    <!-- The invisible reCAPTCHA badge many stores load: must NOT trigger the guard. -->
    <div class="grecaptcha-badge"><iframe title="reCAPTCHA" src="about:blank#/recaptcha/api2/anchor?size=invisible" width="256" height="60"></iframe></div>
  </header>
  <main>
    <h1>Console X 1TB Edition</h1>
    <p>$499.99 — Currently unavailable.</p>
    <button id="add-to-cart" disabled>Add to cart</button>
  </main>
  <script src="/fixture.js"></script>
</body>
</html>
